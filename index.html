<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự án Responsive Web - Món ăn yêu thích</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tiêu đề trang -->
    <header>
        <h1>Top 3 Món Ăn Yêu Thích Của Tôi</h1>
    </header>

    <!-- Vùng chứa lưới (grid) -->
    <main class="grid-container">
        <!-- Hình 1 -->
        <figure>
            <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?q=80&w=400&auto=format&fit=crop" alt="Hình ảnh một bát Phở Bò nóng hổi">
            <p>Phở Bò: Món ăn quốc hồn quốc túy của Việt Nam với nước dùng đậm đà và bánh phở dai mềm.</p>
        </figure>
        
        <!-- Hình 2 -->
        <figure>
            <img src="https://images.unsplash.com/photo-1509722747041-616f39b57569?q=80&w=400&auto=format&fit=crop" alt="Hình ảnh ổ Bánh Mì Việt Nam giòn rụm">
            <p>Bánh Mì: Sự kết hợp hoàn hảo giữa lớp vỏ giòn rụm và nhân thịt, pate, rau sống thơm ngon.</p>
        </figure>
        
        <!-- Hình 3 -->
        <figure>
            <img src="https://images.unsplash.com/photo-1555126634-323283e090f1?q=80&w=400&auto=format&fit=crop" alt="Hình ảnh một đĩa Bún Chả nướng than hoa">
            <p>Bún Chả: Thịt lợn nướng than hoa ăn kèm với bún tươi và nước mắm chua ngọt cực kỳ hấp dẫn.</p>
        </figure>
    </main>
</body>
</html>
